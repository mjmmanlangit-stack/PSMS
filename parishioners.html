<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parish Stewardship Management System - Parishioners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <a href="dashboard.html" class="sidebar-brand">
                    <i class="bi bi-building"></i>
                    <span>PSMS</span>
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="bi bi-graph-up"></i>
                    <span>Dashboard</span>
                </a>
                <a href="parishioners.html" class="nav-item active">
                    <i class="bi bi-people-fill"></i>
                    <span>Parishioners</span>
                </a>
                <a href="contributions.html" class="nav-item">
                    <i class="bi bi-cash-coin"></i>
                    <span>Contributions</span>
                </a>
            </nav>
        </aside>

        <!-- Mobile Sidebar Overlay -->
        <div id="sidebarOverlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Navigation Bar -->
            <nav class="topbar">
                <div class="topbar-left">
                    <button class="btn-toggle-sidebar" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <h1 class="page-title">Parishioners</h1>
                </div>
                <div class="topbar-right">
                    <span class="user-name">Admin</span>
                    <i class="bi bi-person-circle"></i>
                    <button class="btn-logout" onclick="handleLogout()" title="Logout">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>Logout</span>
                    </button>
                </div>
            </nav>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Add Parishioner Section -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="card-title">Add New Parishioner</h5>
                    </div>
                    <div class="card-body">
                        <form id="parishionerForm" onsubmit="addParishioner(event)">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="parishionerName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="parishionerName" placeholder="Enter full name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="parishionerBarangay" class="form-label">Barangay</label>
                                    <input type="text" class="form-control" id="parishionerBarangay" placeholder="Enter barangay" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="parishionerStreet" class="form-label">Street / Cabo</label>
                                    <input type="text" class="form-control" id="parishionerStreet" placeholder="Enter street or cabo" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="parishionerContact" class="form-label">Contact Number</label>
                                    <input type="tel" class="form-control" id="parishionerContact" placeholder="Enter contact number">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-12">
                                    <label for="parishionerNotes" class="form-label">Notes</label>
                                    <textarea class="form-control" id="parishionerNotes" rows="2" placeholder="Any additional notes"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-dark">
                                <i class="bi bi-plus-circle"></i> Add Parishioner
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Search and Filter -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control" id="searchInput" placeholder="Search by name..." onkeyup="filterParishioners()">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <select class="form-select" id="barangayFilter" onchange="filterParishioners()">
                                    <option value="">All Barangays</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Parishioners Table -->
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title">Parishioners List (<span id="parishionerCount">0</span>)</h5>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Barangay</th>
                                    <th>Street / Cabo</th>
                                    <th>Contact</th>
                                    <th>Date Added</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="parishionerTableBody">
                                <tr>
                                    <td colspan="6" class="text-muted text-center py-5">
                                        <i class="bi bi-inbox"></i> No parishioners added yet.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Parishioner Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Parishioner</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editParishionerId">
                        <div class="mb-3">
                            <label for="editName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label for="editBarangay" class="form-label">Barangay</label>
                            <input type="text" class="form-control" id="editBarangay" required>
                        </div>
                        <div class="mb-3">
                            <label for="editStreet" class="form-label">Street / Cabo</label>
                            <input type="text" class="form-control" id="editStreet" required>
                        </div>
                        <div class="mb-3">
                            <label for="editContact" class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" id="editContact">
                        </div>
                        <div class="mb-3">
                            <label for="editNotes" class="form-label">Notes</label>
                            <textarea class="form-control" id="editNotes" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-dark" onclick="saveParishioner()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initializeData();
            displayParishioners();
            updateBarangayFilter();
        });
    </script>
</body>
</html>
