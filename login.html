<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Parish Stewardship Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/landing.css">
    <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
    <!-- Navigation -->


    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <!-- Background decoration -->
            <div class="login-background-shape"></div>

            <!-- Login Card -->
            <div class="login-card">
                <!-- Logo Section -->
                <div class="login-header">
                    <div class="login-logo">
                        <i class="bi bi-building"></i>
                    </div>
                    <h1 class="login-title">PSMS</h1>
                    <p class="login-subtitle">Parish Stewardship Management System</p>
                </div>

                <!-- Welcome Message -->
                <div class="login-welcome">
                    <h2>Welcome Back</h2>
                    <p>Log in to your account to continue</p>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                    <!-- Email/Username Field -->
                    <div class="form-group">
                        <label for="email" class="form-label">Email or Username</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input 
                                type="text" 
                                id="email" 
                                class="form-control login-input" 
                                placeholder="Enter your email or username"
                                required
                                aria-label="Email or Username"
                            >
                        </div>
                        <span class="error-message" id="emailError"></span>
                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <i class="bi bi-lock"></i>
                            <input 
                                type="password" 
                                id="password" 
                                class="form-control login-input" 
                                placeholder="Enter your password"
                                required
                                aria-label="Password"
                            >
                            <button 
                                type="button" 
                                class="btn-toggle-password" 
                                onclick="togglePasswordVisibility()"
                                aria-label="Toggle password visibility"
                            >
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <span class="error-message" id="passwordError"></span>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn-login" id="loginBtn">
                        <span class="btn-text">Log In</span>
                        <span class="btn-loader" id="btnLoader">
                            <i class="bi bi-hourglass-split"></i>
                        </span>
                    </button>

                    <!-- Error Message -->
                    <div class="alert alert-danger alert-dismissible fade hidden" id="loginError" role="alert">
                        <span id="errorText"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Success Message -->
                    <div class="alert alert-success alert-dismissible fade hidden" id="loginSuccess" role="alert">
                        <span id="successText"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                </form>

                <!-- Back to Home -->
                <div class="login-footer">
                    <p>
                        <a href="index.html" class="back-link">
                            <i class="bi bi-arrow-left"></i>
                            Back to Home
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.btn-toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = '<i class="bi bi-eye-slash"></i>';
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
            }
        }

        // Handle Login Form Submission
        function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            // Clear previous errors
            clearErrors();
            
            // Validation
            let isValid = true;
            
            if (!email) {
                showError('emailError', 'Email or username is required');
                isValid = false;
            }
            
            if (!password) {
                showError('passwordError', 'Password is required');
                isValid = false;
            }
            
            if (!isValid) return;
            
            // Show loading state
            setLoadingState(true);
            
            // Simulate API call (500ms delay)
            setTimeout(() => {
                // Simple demo validation
                // In real implementation, this would be an API call
                
                if (email.toLowerCase() === 'admin' && password === 'admin123') {
                    // Store session
                    sessionStorage.setItem('userRole', 'admin');
                    sessionStorage.setItem('userName', 'Administrator');
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    }
                    
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } else if (email.toLowerCase() === 'parishioner' && password === 'user123') {
                    // Store session
                    sessionStorage.setItem('userRole', 'parishioner');
                    sessionStorage.setItem('userName', 'Parishioner User');
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    }
                    
                    showSuccess('Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'parishioner.html';
                    }, 800);
                } else {
                    showLoginError('Invalid email/username or password');
                    setLoadingState(false);
                }
            }, 500);
        }

        // Utility Functions
        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.style.display = 'block';
            }
        }

        function clearErrors() {
            document.getElementById('emailError').textContent = '';
            document.getElementById('passwordError').textContent = '';
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('passwordError').style.display = 'none';
        }

        function showLoginError(message) {
            const errorAlert = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorAlert.classList.remove('hidden');
            errorAlert.classList.add('show');
        }

        function showSuccess(message) {
            const successAlert = document.getElementById('loginSuccess');
            const successText = document.getElementById('successText');
            successText.textContent = message;
            successAlert.classList.remove('hidden');
            successAlert.classList.add('show');
        }

        function setLoadingState(loading) {
            const loginBtn = document.getElementById('loginBtn');
            const btnLoader = document.getElementById('btnLoader');
            const btnText = document.querySelector('.btn-text');
            
            if (loading) {
                loginBtn.disabled = true;
                btnText.style.display = 'none';
                btnLoader.style.display = 'inline-block';
            } else {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
            }
        }

        // Populate remembered email on page load
        document.addEventListener('DOMContentLoaded', function() {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
